# Ludexis: self-hosted catalogue for game folders and archives.
#
#   cp .env.example .env      # set GAMES_PATH (and TZ)
#   docker compose up -d
#
# Then open http://<host>:8420 and sign in as admin / admin. Ludexis asks for a new password straight away,
# then for the games folder (/games) and starts the first scan.
# Optional Prometheus and Grafana: docker compose --profile monitoring up -d (Grafana on port 3000).
# For HTTPS, point a domain at this host and set LUDEXIS_DOMAIN, LUDEXIS_PORT=80 and LUDEXIS_HTTPS_PORT=443.
# Images come from GHCR; add --build to build them from this checkout instead.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB; the backend builds its database URL from the same values.
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ludexis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/ludexis/ludexis-backend:${LUDEXIS_VERSION:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    command: ludexis server
    env_file: .env
    environment:
      ARTWORK_STORAGE_PATH: /data/artwork
      # The JWT secret is generated on first start and kept here unless JWT_SECRET_KEY is set.
      CONFIG_DIR: /data/config
    volumes:
      - ludexis_data:/data
      # Games are only read, never modified. Add a library for /games (or a folder inside it) in the web UI.
      - ${GAMES_PATH:?Set GAMES_PATH to the folder holding your games}:/games:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ludexis", "health", "server"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ghcr.io/ludexis/ludexis-backend:${LUDEXIS_VERSION:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    command: ludexis worker
    env_file: .env
    environment:
      ARTWORK_STORAGE_PATH: /data/artwork
      CONFIG_DIR: /data/config
    volumes:
      - ludexis_data:/data
      - ${GAMES_PATH:?Set GAMES_PATH to the folder holding your games}:/games:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ludexis", "health", "worker"]
      interval: 60s
      timeout: 20s
      retries: 3

  beat:
    image: ghcr.io/ludexis/ludexis-backend:${LUDEXIS_VERSION:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    # Starts due scheduled tasks every five minutes; schedules are edited in Admin > Scheduled Tasks.
    command: ludexis beat
    env_file: .env
    environment:
      ARTWORK_STORAGE_PATH: /data/artwork
      CONFIG_DIR: /data/config
    volumes:
      - ludexis_data:/data
      - ${GAMES_PATH:?Set GAMES_PATH to the folder holding your games}:/games:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ludexis", "health", "beat"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 5m

  frontend:
    image: ghcr.io/ludexis/ludexis-frontend:${LUDEXIS_VERSION:-latest}
    build:
      context: ./frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${LUDEXIS_PORT:-8420}:80"
      - "${LUDEXIS_HTTPS_PORT:-8443}:443"
    environment:
      # Caddy treats an empty value as no site address, so plain HTTP is passed explicitly.
      LUDEXIS_DOMAIN: ${LUDEXIS_DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates for LUDEXIS_DOMAIN.
      - caddy_data:/data
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  # Optional monitoring (docker compose --profile monitoring up -d). Grafana asks to change admin/admin on first sign-in.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  db_data:
  ludexis_data:
  caddy_data:
  prometheus_data:
  grafana_data:
