# Ludexis demo stack
#
# Evaluation environment: PostgreSQL, Redis, backend API, Celery worker and
# beat scheduler, and the Next.js frontend, pre-seeded with a demo dataset.
#
#   export JWT_SECRET_KEY=$(openssl rand -hex 32)
#   docker compose -f docker-compose.demo.yml up -d --build
#
# Optional overrides: POSTGRES_PASSWORD, DEMO_ADMIN_PASSWORD (default Admin123!).
# Then open http://localhost:3000 and log in as admin.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ludexis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ludexis}
      POSTGRES_DB: ludexis
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludexis"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && python -m scripts.seed_demo && uvicorn main:app --host 0.0.0.0 --port 8000"
    env_file: ./backend/.env.docker
    environment: &backend-environment
      ARTWORK_STORAGE_PATH: /artwork
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: postgresql+psycopg://ludexis:${POSTGRES_PASSWORD:-ludexis}@db:5432/ludexis
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY, e.g. export JWT_SECRET_KEY=$(openssl rand -hex 32)}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin123!}
    volumes:
      - artwork_data:/artwork
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file: ./backend/.env.docker
    environment: *backend-environment
    volumes:
      - artwork_data:/artwork
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    # Starts due scheduled tasks (nightly scan, metadata refresh, artwork validation) every five minutes.
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    env_file: ./backend/.env.docker
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
        NEXT_PUBLIC_MEDIA_URL: http://localhost:8000/media
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
  artwork_data:
