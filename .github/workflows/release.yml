name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The release text is the tag's section of docs/release/RELEASE_NOTES.md.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '$0 ~ "^## " tag " " {found=1; next} /^## v/ {found=0} found' docs/release/RELEASE_NOTES.md > notes.md
          test -s notes.md
          gh release create "$TAG" --verify-tag --title "Ludexis $TAG" --notes-file notes.md
